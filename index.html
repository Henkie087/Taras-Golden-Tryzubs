// ================= Traps (timed pop-ups, swings, drops, jets, wind, rams) =================

// springy sunflower bounce pad: wooden base, coil spring, sunflower top; squashes when used
function drawPad(c, pad, t){
  const cx = pad.x + pad.w / 2, gy = pad.gy, sq = pad.sq, wob = sq > 0 ? Math.sin(sq * 18) * sq : 0;
  const coilH = 11 - 7 * sq + wob * 3, topY = gy - 8 - coilH;
  c.save();
  // glow + bobbing arrows to show it's bouncy
  const bob = Math.sin(t * 5) * 3;
  const gl = c.createRadialGradient(cx, topY - 6, 4, cx, topY - 6, 46); gl.addColorStop(0, 'rgba(255,255,255,.75)'); gl.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = gl; c.beginPath(); c.arc(cx, topY - 6, 46, 0, 7); c.fill();
  c.globalAlpha = 0.95 - 0.5 * sq; c.lineCap = 'round'; c.lineJoin = 'round';
  for (const k of [0, 1, 2]){ const ay = topY - 14 - k * 10 + bob; c.beginPath(); c.moveTo(cx - 10, ay + 6); c.lineTo(cx, ay - 3); c.lineTo(cx + 10, ay + 6); c.strokeStyle = '#fff'; c.lineWidth = 6; c.stroke(); c.strokeStyle = k % 2 ? '#0057B7' : '#E65100'; c.lineWidth = 3; c.stroke(); }
  c.globalAlpha = 1;
  // striped red/white base (trampoline frame)
  c.save(); rrect(c, pad.x - 3, gy - 8, pad.w + 6, 8, 3); c.clip(); c.fillStyle = '#fff'; c.fillRect(pad.x - 3, gy - 8, pad.w + 6, 8); c.fillStyle = '#D32F2F'; for (let xx = pad.x - 3; xx < pad.x + pad.w + 6; xx += 10) c.fillRect(xx, gy - 8, 5, 8); c.restore();
  c.strokeStyle = '#7A1C1C'; c.lineWidth = 1; rrect(c, pad.x - 3, gy - 8, pad.w + 6, 8, 3); c.stroke();
  // coil spring
  c.strokeStyle = '#5E6B78'; c.lineWidth = 2.6; c.beginPath(); const n = 4;
  for (let k = 0; k <= n * 2; k++){ const yy = gy - 8 - coilH * k / (n * 2), xx = cx + (k % 2 ? 12 : -12); if (k === 0) c.moveTo(cx - 12, yy); else c.lineTo(xx, yy); } c.stroke();
  c.strokeStyle = '#B9C4CF'; c.lineWidth = 1; c.stroke();
  // sunflower top (flattened, squashes wider when bouncing)
  const rx = pad.w / 2 + 4 + sq * 5, ry = 6 - sq * 2;
  c.fillStyle = '#F2A900'; c.beginPath(); c.ellipse(cx, topY, rx + 3, ry + 2.5, 0, 0, 7); c.fill();
  c.fillStyle = '#FFD500'; for (let k = 0; k < 12; k++){ const a = k / 12 * Math.PI * 2; c.beginPath(); c.ellipse(cx + Math.cos(a) * rx * 0.82, topY + Math.sin(a) * ry * 0.8, 6, 3, a, 0, 7); c.fill(); }
  c.fillStyle = '#6B3E14'; c.beginPath(); c.ellipse(cx, topY, rx * 0.52, ry * 0.62, 0, 0, 7); c.fill();
  c.fillStyle = '#8B5A2B'; for (let k = 0; k < 6; k++){ c.beginPath(); c.arc(cx - rx * 0.32 + k * rx * 0.13, topY - 0.6 + (k % 2) * 1.4, 1, 0, 7); c.fill(); }
  c.restore();
}
function drawSpikes(c, s){
